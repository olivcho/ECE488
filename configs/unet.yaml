# Full U-Net baseline. Run on a GPU, using --checkpoint-root for Google Drive.
experiment: {root: experiments, name: unet_baseline, technique: unet}
data:
  source: huggingface
  cache_dir: data/raw/huggingface
  train_shards: null        # null loads all 24,000 pairs
  val_size: 1000
  split_seed: 488
  max_train_examples: null
  max_val_examples: null
  val_from_train: false
  num_workers: 2
model: {base_channels: 32, depth: 4}
train:
  seed: 488
  epochs: 20
  batch_size: 8
  learning_rate: 1.0e-4
  lpips_weight: 1.0         # Starting value, not tuned yet
  eval_every: 1
