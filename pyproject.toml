[project]
name = "lensless"
version = "0.1.0"
description = "Lensless reconstruction transfer experiments for ECE488"
requires-python = ">=3.11"
dependencies = [
    "datasets>=5.1.0",
    "huggingface-hub>=2.4.0",
    "lpips>=0.1.4",
    "matplotlib>=3.11.2",
    "pillow>=13.0.0",
    "pyyaml>=6.0.3",
    "tifffile>=2026.3.3",
    "torch>=2.15.0",
    "torchmetrics>=1.9.0",
    "torchvision>=0.29.2",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lensless"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
